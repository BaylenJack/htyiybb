<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网络测速 · SpeedTest</title>
  <meta name="description" content="纯前端浏览器网络测速工具，测量下载、上传速度与延迟">
  <style>
    /* ========== 深色主题变量 ========== */
    :root {
      --bg: #0b1220;
      --bg-gradient: radial-gradient(1200px 800px at 50% -10%, #152238 0%, #0b1220 55%, #070b14 100%);
      --surface: #151d2e;
      --surface-2: #1c2638;
      --border: #26314a;
      --text: #e8edf6;
      --text-secondary: #8b96ab;
      --accent: #22d3ee;
      --accent-2: #3b82f6;
      --success: #22c55e;
      --good: #84cc16; /* 速度分级「好」档（介于 success 与 warning 之间的青绿色） */
      --warning: #eab308;
      --danger: #ef4444;
    }

    /* ========== 基础 ========== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: var(--bg);
      background-image: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 48px 20px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 36px;
      flex: 1;
    }

    /* ========== 顶部标题 ========== */
    .header { text-align: center; }

    .logo { font-size: 40px; line-height: 1; }

    .title {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-top: 10px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      margin-top: 10px;
      font-size: 14px;
      color: var(--text-secondary);
    }

    /* ========== 状态行（服务器位置） ========== */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-secondary);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    /* ========== 中央大圆形测速按钮 ========== */
    .test-area { display: flex; justify-content: center; }

    .ring-button {
      position: relative;
      width: 260px;
      height: 260px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s ease;
    }

    .ring-button:hover { transform: scale(1.03); }

    .ring-button:active { transform: scale(0.98); }

    .ring-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; }

    .ring { position: absolute; inset: 0; transform: rotate(-90deg); }

    .ring-track,
    .ring-progress {
      fill: none;
      stroke-width: 10;
      stroke-linecap: round;
    }

    .ring-track { stroke: var(--surface-2); }

    /* 渐变进度圆环；stroke-dashoffset 由测速 JS 驱动（下载/上传进度 0→100%） */
    .ring-progress {
      stroke: url(#ringGradient);
      stroke-dasharray: 754;
      stroke-dashoffset: 754;
      transition: stroke-dashoffset 0.2s ease-out;
    }

    .ring-content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .ring-value {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 1px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .ring-sub { font-size: 13px; color: var(--text-secondary); }

    /* ========== 三个指标卡 ========== */
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      width: 100%;
    }

    .metric-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 12px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.2s ease;
    }

    .metric-card:hover { border-color: var(--accent); }

    .metric-label { font-size: 13px; color: var(--text-secondary); }

    .metric-value {
      font-size: 28px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .metric-sub { font-size: 12px; color: var(--text-secondary); }

    /* ========== 底部结果详情表 + 速度分级色条 ========== */
    .details {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
    }

    .details-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--text-secondary);
    }

    .details-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .details-table th,
    .details-table td {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    .details-table tr:last-child th,
    .details-table tr:last-child td { border-bottom: none; }

    .details-table th {
      font-weight: 400;
      color: var(--text-secondary);
      width: 40%;
    }

    .details-table td {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .speed-scale {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .scale-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-secondary);
      transition: opacity 0.3s ease;
    }

    .scale-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      color: var(--text-secondary);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* 分级色块颜色（语义色变量）；档位高亮由测速 JS 驱动 */
    .scale-dot.great { background: var(--success); color: var(--success); }
    .scale-dot.good { background: var(--good); color: var(--good); }
    .scale-dot.fair { background: var(--warning); color: var(--warning); }
    .scale-dot.poor { background: var(--danger); color: var(--danger); }

    /* 结果展示：未命中的档位变暗，命中的档位高亮（色块放大 + 同色辉光） */
    .speed-scale.has-result .scale-item { opacity: 0.45; }
    .speed-scale.has-result .scale-item.active { opacity: 1; }
    .speed-scale.has-result .scale-item.active .scale-dot {
      transform: scale(1.35);
      box-shadow: 0 0 10px currentColor;
    }

    /* 下载失败：无有效等级，整条置灰（去色 + 变暗） */
    .speed-scale.muted .scale-item { opacity: 0.35; }
    .speed-scale.muted .scale-dot { filter: grayscale(1); }

    /* ========== 页脚 ========== */
    .footer {
      padding: 20px;
      text-align: center;
      font-size: 12px;
      color: var(--text-secondary);
      opacity: 0.7;
    }

    /* ========== 响应式 ========== */
    @media (max-width: 480px) {
      .metrics { grid-template-columns: 1fr; }
      .ring-button { width: 220px; height: 220px; }
      .ring-value { font-size: 30px; }
    }
  </style>
</head>
<body>

  <main class="container">

    <!-- 顶部标题 -->
    <header class="header">
      <div class="logo">⚡</div>
      <h1 class="title">网络测速</h1>
      <p class="subtitle">测量你的网络延迟、下载与上传速度</p>
    </header>

    <!-- 状态行：服务器位置 -->
    <div class="status-bar">
      <span class="status-dot"></span>
      <span id="server-location">正在检测服务器…</span>
    </div>

    <!-- 中央大圆形测速按钮（SVG 圆环进度 + 中间文字） -->
    <section class="test-area" aria-label="测速控制">
      <div class="ring-button" id="ring-button" role="button" aria-label="开始测速" tabindex="0">
        <svg class="ring" viewBox="0 0 260 260" aria-hidden="true">
          <defs>
            <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#22d3ee"></stop>
              <stop offset="100%" stop-color="#3b82f6"></stop>
            </linearGradient>
          </defs>
          <!-- 背景圆环 -->
          <circle class="ring-track" cx="130" cy="130" r="120"></circle>
          <!-- 进度圆环（stroke-dashoffset 由 JS 驱动：下载/上传进度） -->
          <circle class="ring-progress" id="ring-progress" cx="130" cy="130" r="120"></circle>
        </svg>
        <div class="ring-content">
          <div class="ring-value" id="ring-value">开始</div>
          <div class="ring-sub" id="ring-sub">点击测速</div>
        </div>
      </div>
    </section>

    <!-- 三个指标卡 -->
    <section class="metrics" aria-label="测速指标">
      <div class="metric-card">
        <div class="metric-label">Ping</div>
        <div class="metric-value" id="ping-value">—</div>
        <div class="metric-sub" id="jitter-value">抖动 —</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">下载</div>
        <div class="metric-value" id="download-value">—</div>
        <div class="metric-sub">Mbps</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">上传</div>
        <div class="metric-value" id="upload-value">—</div>
        <div class="metric-sub">Mbps</div>
      </div>
    </section>

    <!-- 底部结果详情表 + 速度分级色条 -->
    <section class="details" aria-label="结果详情">
      <h2 class="details-title">结果详情</h2>
      <table class="details-table">
        <tbody>
          <tr><th>Ping</th><td id="detail-ping">—</td></tr>
          <tr><th>抖动</th><td id="detail-jitter">—</td></tr>
          <tr><th>下载速度</th><td id="detail-download">—</td></tr>
          <tr><th>上传速度</th><td id="detail-upload">—</td></tr>
          <tr><th>IP 地址</th><td id="detail-ip">—</td></tr>
          <tr><th>服务器位置</th><td id="detail-server">—</td></tr>
        </tbody>
      </table>

      <div class="speed-scale" id="speed-scale" aria-label="速度分级">
        <span class="scale-item great"><i class="scale-dot great"></i>极好</span>
        <span class="scale-item good"><i class="scale-dot good"></i>好</span>
        <span class="scale-item fair"><i class="scale-dot fair"></i>一般</span>
        <span class="scale-item poor"><i class="scale-dot poor"></i>差</span>
      </div>
    </section>

  </main>

  <footer class="footer">
    <p>测速流量直达 Cloudflare 边缘节点 · 数据仅在浏览器本地计算</p>
  </footer>

  <script>
    /* ========== 测速引擎（内联，保持单文件） ========== */
    (function () {
      'use strict';

      // Cloudflare 测速端点：bytes=0 返回空响应体，适合延迟探测
      const PING_URL = 'https://speed.cloudflare.com/__down?bytes=0';
      const PING_SAMPLES = 5;
      // 单次延迟探测超时：网络挂起时中止请求，避免整个测速流程无限阻塞
      const PING_TIMEOUT_MS = 10000;

      /**
       * 带计时的 fetch 封装，支持超时中止。
       * @param {string} url 请求地址
       * @param {RequestInit & {timeoutMs?: number}} [options]
       *   fetch 选项；timeoutMs 为超时毫秒数（默认 15000）。
       *   超时经 AbortSignal.timeout 实现，并与调用方传入的 signal 合并（任一触发即中止）。
       * @returns {Promise<{response: Response, durationMs: number}>} 响应与耗时（ms）
       */
      async function fetchWithTiming(url, options = {}) {
        const { timeoutMs = 15000, signal, ...fetchOptions } = options;
        const start = performance.now();
        const mergedSignal = signal
          ? AbortSignal.any([signal, AbortSignal.timeout(timeoutMs)])
          : AbortSignal.timeout(timeoutMs);
        const response = await fetch(url, { ...fetchOptions, signal: mergedSignal });
        return { response, durationMs: performance.now() - start };
      }

      /**
       * 延迟与抖动测量：5 次 0 字节请求，
       * 取最小值为延迟，抖动 = 各次延迟与最小延迟差值的平均（平均偏差）。
       * @returns {Promise<{latencyMs: number, jitterMs: number}>}
       */
      async function measureLatency() {
        // 预热请求（丢弃结果）：建立 DNS/连接/TLS，避免冷启动把抖动抬高到失真水平。
        // best-effort：失败则跳过，不阻塞采样。
        try {
          await fetchWithTiming(`${PING_URL}&_=${Date.now()}-warmup`, { timeoutMs: PING_TIMEOUT_MS });
        } catch {
          // 预热失败可忽略
        }
        const samples = [];
        for (let i = 0; i < PING_SAMPLES; i++) {
          // 时间戳查询参数防浏览器缓存
          const { durationMs } = await fetchWithTiming(`${PING_URL}&_=${Date.now()}-${i}`, {
            timeoutMs: PING_TIMEOUT_MS,
          });
          samples.push(durationMs);
        }
        const latencyMs = Math.min(...samples);
        const jitterMs =
          samples.reduce((sum, s) => sum + Math.abs(s - latencyMs), 0) / samples.length;
        const result = { latencyMs, jitterMs };
        updateLatencyUI(result);
        return result;
      }

      /* ========== 速率计（下载 / 上传共享的测量骨架） ========== */

      const RING_CIRCUMFERENCE = 754; // 圆环周长 2π×120；stroke-dashoffset 从 754 减到 0 表示进度 0→100%
      const RING_EMA_ALPHA = 0.2; // 实时速率 EMA 平滑系数（rAF 每帧更新，越小越平滑）
      const SAMPLE_INTERVAL_MS = 200; // 采样间隔：供最终稳定段计算
      // 最终值取稳定段：跳过前 max(20% 时长, 1000ms)（连接起步爬坡、拥塞窗口效应），
      // 对剩余窗口取平均吞吐
      const STABLE_SKIP_RATIO = 0.2;
      // 稳定段最小绝对时长：1Gbps 等高带宽下总时长可能仅 ~1.5s，20% 比例会把窗口
      // 压进慢启动爬坡段；1s 下限保证窗口至少覆盖一段稳态传输
      const STABLE_MIN_MS = 1000;

      /**
       * 通用速率计：rAF + EMA 实时速率、200ms 采样、稳定段最终值计算、圆环/卡片 UI 驱动。
       * 由 measureDownload / measureUpload 各自提供 state、常量与 UI 元素，共享同一骨架。
       * @param {object} deps 依赖注入
       * @param {{t0: number|null, bytes: number}} deps.state 共享累计字节；t0 由阶段在首字节发出时置位
       * @param {{capacityBytes: number}} deps.constants 阶段常量
       *   capacityBytes：进度 100% 对应的总字节量（测满即提前结束）
       * @param {{ringValue: Element, ringSub: Element, ringProgress: Element, metricValue: Element}} deps.elements
       *   环内大数字 / 环下小字 / 进度圆环 / 对应指标卡数值
       * @param {string} deps.phaseLabel 阶段文案，如「下载测速中…」
       * @param {number} [deps.instWindowMs] 瞬时速率计算窗口（0 = 帧间差分，默认）。
       *   流式下载用帧间差分 + EMA 即平滑；上传字节以 5MB 批跳变，帧间斜率只是批次
       *   落地噪音，需 ≥1s 窗口的平均速率才接近真实吞吐
       * @param {(info: {mbps: number, progress: number}) => void} [deps.onProgress]
       *   每帧回调：实时平滑速率（Mbps）与传输进度 0~1
       * @returns {{
       *   renderLoop: () => void, updateDisplay: () => void, finish: (finalMbps: number) => void,
       *   resetUi: () => void, dispose: () => void
       * }}
       *   renderLoop：rAF 主循环（阶段期间持续调用；done 后自动退出）；finish：收尾（写最终值、恢复圆环）；
       *   resetUi：进入测速前的 UI 清零复位；dispose：结束时停掉采样器
       */
      function createRateMeter({ state, constants, elements, phaseLabel, instWindowMs = 0, onProgress }) {
        const samples = []; // 200ms 采样 {t, bytes}，供最终稳定段计算
        let done = false;

        /** 进入测速 UI：环内数字清零、圆环复位 */
        function resetUi() {
          elements.ringValue.textContent = '0.0';
          elements.ringSub.textContent = phaseLabel;
          elements.ringProgress.style.strokeDashoffset = String(RING_CIRCUMFERENCE);
        }

        /** rAF 帧回调：帧间字节差 → 瞬时速率 → EMA 平滑 → 环内大数字 + 圆环进度 + 指标卡 */
        let emaMbps = 0;
        let hasEma = false;
        let prevBytes = 0;
        let prevTime = null;
        // 滑动窗口速率状态（instWindowMs > 0 时启用）：窗口内的平均吞吐
        let winBytes = 0;
        let winTime = null;
        let winRate = 0;
        function updateDisplay() {
          if (state.t0 === null || done) return;
          const now = performance.now();
          if (prevTime !== null) {
            let instMbps;
            if (instWindowMs > 0) {
              // 窗口速率：批次落地才更新；窗口未满时沿用上次值
              if (winTime === null || now - winTime >= instWindowMs) {
                // 首帧分母用 t0 起的实际已过时间（否则首帧会按满窗口时长
                // 估算速率，显示 ~40Mbps 量级的伪值）
                const winSec =
                  (winTime === null ? Math.max(now - state.t0, 1) : Math.max(now - winTime, 1)) / 1000;
                winRate = ((state.bytes - winBytes) * 8) / 1e6 / winSec;
                winBytes = state.bytes;
                winTime = now;
              }
              instMbps = winRate;
            } else {
              // 帧间差分：流式下载逐块到达，帧间速率即真实瞬时吞吐
              const dtSec = Math.max(now - prevTime, 1) / 1000;
              instMbps = ((state.bytes - prevBytes) * 8) / 1e6 / dtSec;
            }
            emaMbps = hasEma ? emaMbps * (1 - RING_EMA_ALPHA) + instMbps * RING_EMA_ALPHA : instMbps;
            hasEma = true;
            // 进度 = 已传输字节 / 总载荷（并发连接 × 每连接载荷），读满即 100%；
            // 有连接失败时按剩余连接数折算，避免圆环卡在低于 100% 的位置
            const progress = Math.min(state.bytes / Math.max(constants.capacityBytes, 1), 1);
            elements.ringValue.textContent = emaMbps.toFixed(1);
            elements.ringProgress.style.strokeDashoffset = String(RING_CIRCUMFERENCE * (1 - progress));
            elements.metricValue.textContent = emaMbps.toFixed(1);
            if (onProgress) onProgress({ mbps: emaMbps, progress });
          }
          prevBytes = state.bytes;
          prevTime = now;
        }

        /** rAF 主循环：页面不可见时浏览器暂停 rAF，由采样器兜底驱动 */
        function renderLoop() {
          if (done) return;
          updateDisplay();
          requestAnimationFrame(renderLoop);
        }

        // 200ms 采样器：push 样本供最终稳定段计算；同时驱动一次仪表盘——
        // 页面不可见时浏览器暂停 rAF，采样器兜底保证仪表盘仍实时更新
        const samplerId = setInterval(() => {
          if (state.t0 !== null) {
            samples.push({ t: performance.now() - state.t0, bytes: state.bytes });
            updateDisplay();
          }
        }, SAMPLE_INTERVAL_MS);

        /** 阶段结束（正常或失败路径都调用）：停采样器 */
        function dispose() {
          done = true;
          clearInterval(samplerId);
        }

        /** 环恢复默认：finish 与失败路径共用（文字「开始/点击测速」+ 圆环复位） */
        function restoreRing() {
          elements.ringValue.textContent = '开始';
          elements.ringSub.textContent = '点击测速';
          elements.ringProgress.style.strokeDashoffset = String(RING_CIRCUMFERENCE);
        }

        /** 收尾：指标卡写最终值，环内文字与圆环恢复默认 */
        function finish(finalMbps) {
          elements.metricValue.textContent = finalMbps.toFixed(1);
          restoreRing();
          if (onProgress) onProgress({ mbps: finalMbps, progress: 1 });
        }

        /**
         * 最终值：稳定段 = 跳过前 max(20% 时长, 1000ms)（连接起步爬坡、拥塞窗口效应），
         * 对窗口内累计字节取斜率；窗口样本不足时回退全程平均。
         * @param {number} durationMs 测速时长（首字节到末字节）
         * @returns {number} 稳定段平均吞吐（Mbps）
         */
        function stableMbps(durationMs) {
          samples.push({ t: durationMs, bytes: state.bytes }); // 补尾部样本，稳定段覆盖末段
          const skipMs = Math.max(durationMs * STABLE_SKIP_RATIO, STABLE_MIN_MS);
          const stable = samples.filter((s) => s.t >= skipMs);
          if (stable.length >= 2) {
            const first = stable[0];
            const last = stable[stable.length - 1];
            return ((last.bytes - first.bytes) * 8) / 1e6 / (Math.max(last.t - first.t, 1) / 1000);
          }
          if (durationMs >= 1) return (state.bytes * 8) / 1e6 / (durationMs / 1000);
          return 0;
        }

        return { renderLoop, updateDisplay, finish, restoreRing, resetUi, dispose, stableMbps };
      }

      /* ========== 下载测速 ========== */

      // Cloudflare 测速端点：bytes=N 返回 N 字节随机数据并流式输出
      const DOWNLOAD_BYTES_PER_CONNECTION = 50000000; // 每连接 50MB 载荷
      const DOWNLOAD_URL = `https://speed.cloudflare.com/__down?bytes=${DOWNLOAD_BYTES_PER_CONNECTION}`;
      const DOWNLOAD_CONCURRENCY = 3; // 并发连接数
      // 目标时长约 8 秒：约 150Mbps 的连接 3 路并发约 8 秒读满；
      // 更快时以读满提前结束，总传输量封顶 3×50MB = 150MB
      const DOWNLOAD_DURATION_MS = 8000;
      // 连接级超时：测试时长 + 余量。挂起连接在此超时并记失败，不无限拖长整体测试
      const DOWNLOAD_CONNECTION_TIMEOUT_MS = DOWNLOAD_DURATION_MS + 5000;

      /**
       * 并发流式下载测速。
       * 3 路并发拉取 50MB 随机数据，逐块累计字节；rAF + EMA 平滑实时速率并驱动
       * 环内仪表盘；约 8 秒或全部连接读满载荷后停止，最终值取稳定段平均吞吐。
       * 单个连接失败只跳过该连接（记入 failedConnections），不中止整体；
       * 仅当全部连接失败或总传输 0 字节时才整体判失败。
       * @param {(info: {mbps: number, progress: number}) => void} [onProgress]
       *   每帧回调：实时平滑速率（Mbps）与传输进度 0~1；结束时以最终值 + progress: 1 调用一次
       * @returns {Promise<{downloadMbps: number, totalBytes: number, durationMs: number, failedConnections: number}>}
       *   最终下载速度（Mbps）、总传输字节、测速时长（ms）、失败连接数（0~3）
       */
      async function measureDownload(onProgress) {
        // 共享状态：t0 = 计时起点，bytes = 全连接累计字节，lastByteAt = 最后一个字节到达时刻
        const state = { t0: null, bytes: 0, lastByteAt: null };
        const failures = []; // 逐连接失败记录：单个失败只跳过该连接，不中止整体

        const downloadValue = document.getElementById('download-value');
        const prevDownloadText = downloadValue.textContent; // 失败时恢复卡片（阶段开始前的有效值）
        // 进度分母需在阶段内随失败连接数折算（见 runConnection catch），故持对象引用
        const constants = {
          capacityBytes: DOWNLOAD_CONCURRENCY * DOWNLOAD_BYTES_PER_CONNECTION,
        };
        const meter = createRateMeter({
          state,
          constants,
          elements: {
            ringValue: document.getElementById('ring-value'),
            ringSub: document.getElementById('ring-sub'),
            ringProgress: document.getElementById('ring-progress'),
            metricValue: downloadValue,
          },
          phaseLabel: '下载测速中…',
          onProgress,
        });
        meter.resetUi();
        requestAnimationFrame(meter.renderLoop);

        /** 单条连接：拉流并逐块累计字节；时长到或读满即止。失败仅记入 failures，不中止整体 */
        async function runConnection(i) {
          const url = `${DOWNLOAD_URL}&_=${Date.now()}-${i}`;
          try {
            const { response } = await fetchWithTiming(url, {
              timeoutMs: DOWNLOAD_CONNECTION_TIMEOUT_MS,
            });
            if (!response.ok) throw new Error(`下载连接 ${i + 1} 失败：HTTP ${response.status}`);
            if (!response.body) throw new Error(`下载连接 ${i + 1} 无流式响应体`);
            const reader = response.body.getReader();
            try {
              for (;;) {
                const { value, done } = await reader.read();
                if (done) break;
                state.bytes += value.byteLength;
                const now = performance.now();
                state.lastByteAt = now;
                // 计时起点：首个 chunk 到达的时刻（而非 fetch 发起时刻）——
                // 排除 DNS/TCP/TLS 连接建立延迟，测的是纯传输吞吐；3 个 fetch
                // 同一批次发起，各连接首 chunk 时差远小于建立延迟，对结果影响 <2%
                if (state.t0 === null) state.t0 = now;
                // 时长到即停（各连接自检同一时钟，约同时停止）
                if (now - state.t0 >= DOWNLOAD_DURATION_MS) break;
              }
            } finally {
              // 时长截止未读完时取消底层连接、立即停流；已读完时 cancel 是安全的 no-op
              reader.cancel().catch(() => {});
            }
          } catch (err) {
            failures.push(err);
            // 进度分母按剩余连接数折算，避免圆环卡在低于 100% 的位置
            adjustCapacity();
          }
        }

        /** 进度分母按剩余连接数折算，避免圆环卡在低于 100% 的位置 */
        function adjustCapacity() {
          constants.capacityBytes =
            (DOWNLOAD_CONCURRENCY - failures.length) * DOWNLOAD_BYTES_PER_CONNECTION;
        }

        const connections = [];
        for (let i = 0; i < DOWNLOAD_CONCURRENCY; i++) connections.push(runConnection(i));
        // 等全部连接收尾（成功或失败都算）；逐连接失败已被 runConnection 捕获
        await Promise.allSettled(connections);
        meter.dispose();

        // 全部连接失败，或总传输 0 字节（HTTP 200 但空/极小响应体）→ 没有有效数据，整体判失败
        if (failures.length === DOWNLOAD_CONCURRENCY || state.bytes === 0) {
          meter.restoreRing(); // 环恢复默认
          downloadValue.textContent = prevDownloadText; // 卡片恢复上次的有效值
          throw new Error(
            failures.length
              ? `下载测速失败：${failures.map((f) => f.message).join('；')}`
              : '下载测速失败：连接均未返回数据'
          );
        }
        if (failures.length > 0) {
          // 部分连接失败：结果由剩余连接得出；仅记录，不打断测速
          console.warn('下载测速：部分连接失败，已用其余连接出结果', failures);
        }

        // 测速时长：取最后一个字节到达的时刻（丢弃失败连接造成的空转尾段，
        // 避免稳定段窗口包含零斜率平线而拖低最终值）
        const durationMs = (state.lastByteAt ?? state.t0) - state.t0;
        const downloadMbps = meter.stableMbps(durationMs);

        // 收尾：指标卡写最终值，圆环恢复默认
        meter.finish(downloadMbps);

        return {
          downloadMbps,
          totalBytes: state.bytes,
          durationMs,
          failedConnections: failures.length,
        };
      }

      /* ========== 上传测速 ========== */

      // Cloudflare 测速端点：POST 任意数据体，响应 JSON 无需读取，传完即止
      const UPLOAD_URL = 'https://speed.cloudflare.com/__up';
      const UPLOAD_CONCURRENCY = 2; // 并发连接数
      const UPLOAD_BYTES_PER_BATCH = 5 * 1024 * 1024; // 每批 5MB 随机数据
      const UPLOAD_BATCHES_PER_CONNECTION = 3; // 每连接分批上传
      // 每连接载荷 3×5MB=15MB，两路并发共 30MB 封顶；快传完时自动提前结束
      const UPLOAD_BYTES_PER_CONNECTION = UPLOAD_BATCHES_PER_CONNECTION * UPLOAD_BYTES_PER_BATCH;
      // 目标时长约 8 秒：约 30Mbps 的连接两路并发约 8 秒传满；更快时以传满提前结束
      const UPLOAD_DURATION_MS = 8000;
      // 连接级超时：测试时长 + 余量。挂起连接在此超时并记失败，不无限拖长整体测试
      const UPLOAD_CONNECTION_TIMEOUT_MS = UPLOAD_DURATION_MS + 5000;

      /**
       * 生成 size 字节的密码学随机数据（Uint8Array）。
       * crypto.getRandomValues 单次上限 65536 字节，超过需分块填充。
       * @param {number} size 字节数
       * @returns {Uint8Array}
       */
      function randomBytes(size) {
        const chunkSize = 65536; // getRandomValues 单次调用上限
        const buffer = new Uint8Array(size);
        for (let offset = 0; offset < size; offset += chunkSize) {
          crypto.getRandomValues(buffer.subarray(offset, Math.min(offset + chunkSize, size)));
        }
        return buffer;
      }

      /**
       * 并发上传测速。
       * 2 路并发 POST 随机数据（每连接 3 批 × 5MB），共享累计字节；rAF + 滑动窗口速率平滑
       * 并驱动环内仪表盘；约 8 秒或全部连接传满载荷后停止，最终值取全程平均吞吐。
       * 单个连接失败只跳过该连接（记入 failedConnections），不中止整体；
       * 仅当全部连接失败或总传输 0 字节时才整体判失败。
       * @param {(info: {mbps: number, progress: number}) => void} [onProgress]
       *   每帧回调：实时平滑速率（Mbps）与传输进度 0~1；结束时以最终值 + progress: 1 调用一次
       * @returns {Promise<{uploadMbps: number, totalBytes: number, durationMs: number, failedConnections: number}>}
       *   最终上传速度（Mbps）、总传输字节、测速时长（ms）、失败连接数（0~2）
       */
      async function measureUpload(onProgress) {
        // 共享状态：t0 = 计时起点，bytes = 全连接累计字节，lastByteAt = 最后一个字节发出时刻，
        // bytesAtT0 = t0 时刻的累计字节——速率分子的基线（见最终值计算）
        const state = { t0: null, bytes: 0, bytesAtT0: 0, lastByteAt: null };
        const failures = []; // 逐连接失败记录：单个失败只跳过该连接，不中止整体

        /** 每连接 5MB 随机载荷（Uint8Array + Blob）：重试时复用同一 payload，省去重复生成 */
        const payload = randomBytes(UPLOAD_BYTES_PER_BATCH);
        const body = new Blob([payload]);

        const uploadValue = document.getElementById('upload-value');
        const prevUploadText = uploadValue.textContent; // 失败时恢复卡片（阶段开始前的有效值）
        // 进度分母需在阶段内随失败连接数折算（见 runConnection catch），故持对象引用
        const constants = {
          capacityBytes: UPLOAD_CONCURRENCY * UPLOAD_BYTES_PER_CONNECTION,
        };
        const meter = createRateMeter({
          state,
          constants,
          elements: {
            ringValue: document.getElementById('ring-value'),
            ringSub: document.getElementById('ring-sub'),
            ringProgress: document.getElementById('ring-progress'),
            metricValue: uploadValue,
          },
          phaseLabel: '上传测速中…',
          instWindowMs: 1000, // 批次跳变下窗口速率才接近真实吞吐
          onProgress,
        });
        meter.resetUi();
        requestAnimationFrame(meter.renderLoop);

        /** 单条连接：循环 3 批 POST；时长到或传满即止。失败仅记入 failures，不中止整体 */
        async function runConnection(i) {
          const url = `${UPLOAD_URL}?_=${Date.now()}-${i}`;
          try {
            for (let b = 0; b < UPLOAD_BATCHES_PER_CONNECTION; b++) {
              const { response } = await fetchWithTiming(url, {
                method: 'POST',
                body,
                timeoutMs: UPLOAD_CONNECTION_TIMEOUT_MS,
              });
              // CORS 会吞掉跨域响应体，此处只需校验请求是否被服务端接受；
              // 正常情况返回 JSON（含 server-timing 等元数据），无需读取
              if (!response.ok) throw new Error(`上传连接 ${i + 1} 失败：HTTP ${response.status}`);
              state.bytes += body.size;
              const now = performance.now();
              state.lastByteAt = now;
              // 计时起点：首批 body 提交完成时刻（response 落地即代表请求体已全部发出）——
              // 浏览器 fetch 不暴露 body 开始传输的时刻，响应返回是唯一可靠的
              // 「该批 body 已全部送达」信号；连接建立延迟对上传影响远小于下载，可忽略
              if (state.t0 === null) {
                state.t0 = now;
                // 分子基线：仅 t0 之后送出的字节计入速率（见最终值计算的注释）
                state.bytesAtT0 = state.bytes;
              }
              // 时长到即停（各连接自检同一时钟，约同时停止）
              if (now - state.t0 >= UPLOAD_DURATION_MS) break;
            }
          } catch (err) {
            failures.push(err);
            // 失败批的 5MB 已送出，计入累计字节（供进度与 totalBytes；速率分子用 bytesAtT0 基线
            // 吸收 t0 之前落入的部分——其余正常成功批均有时间归属，可接受）
            state.bytes += body.size;
            adjustCapacity();
          }
        }

        /** 进度分母按剩余连接数折算，避免圆环卡在低于 100% 的位置 */
        function adjustCapacity() {
          constants.capacityBytes =
            (UPLOAD_CONCURRENCY - failures.length) * UPLOAD_BYTES_PER_CONNECTION;
        }

        const connections = [];
        for (let i = 0; i < UPLOAD_CONCURRENCY; i++) connections.push(runConnection(i));
        // 等全部连接收尾（成功或失败都算）；逐连接失败已被 runConnection 捕获
        await Promise.allSettled(connections);
        meter.dispose();

        // 全部连接失败，或总传输 0 字节（防御分支：每条连接至少成功提交一批才可能
        // 继续，因此正常路径恒 >0；仅全部连接失败可达此处）→ 没有有效数据，整体判失败
        if (failures.length === UPLOAD_CONCURRENCY || state.bytes === 0) {
          meter.restoreRing(); // 环恢复默认
          uploadValue.textContent = prevUploadText; // 卡片恢复上次的有效值
          throw new Error(
            failures.length
              ? `上传测速失败：${failures.map((f) => f.message).join('；')}`
              : '上传测速失败：连接均未上传数据'
          );
        }
        if (failures.length > 0) {
          // 部分连接失败：结果由剩余连接得出；仅记录，不打断测速
          console.warn('上传测速：部分连接失败，已用其余连接出结果', failures);
        }

        // 测速时长：取最后一个字节发出的时刻（丢弃失败连接造成的空转尾段，
        // 避免稳定段窗口包含零斜率平线而拖低最终值）
        const durationMs = (state.lastByteAt ?? state.t0) - state.t0;
        // 最终值 = 全程均值。分子用 bytesAtT0 基线：批次串行（批次 n+1 在批次 n 响应后才开始），
        // 批次 1 在 t0 之前已送出，若计入分子会用 N-1 个批周期分摊 N 批字节，系统性高估
        // N/(N-1)（N=3 时 1.5×）。减掉基线后分子精确对应 t0→末字节的全部字节。
        // 上传字节以 5MB 批跳变，200ms 采样间的「斜率」只是批次落地噪音而非真实速率——
        // 实测单批 5MB 在采样窗内落地会产生 >1Gbps 的虚假斜率，故不做稳定段斜率
        const uploadMbps =
          ((state.bytes - state.bytesAtT0) * 8) / 1e6 / Math.max(durationMs / 1000, 1);

        // 收尾：指标卡写最终值，圆环恢复默认
        meter.finish(uploadMbps);

        return {
          uploadMbps,
          totalBytes: state.bytes,
          durationMs,
          failedConnections: failures.length,
        };
      }

      /* ========== UI 更新 ========== */

      /** 更新 Ping 指标卡（数值 + 抖动子行） */
      function updateLatencyUI({ latencyMs, jitterMs }) {
        document.getElementById('ping-value').textContent = `${Math.round(latencyMs)} ms`;
        document.getElementById('jitter-value').textContent = `抖动 ${jitterMs.toFixed(1)} ms`;
      }

      /** 指标卡初始占位符（无结果时的显示；页面加载与测速启动时使用） */
      const METRIC_PLACEHOLDER = '—';

      /** 测速启动：全部指标卡归零复位 */
      function resetMetrics() {
        document.getElementById('ping-value').textContent = METRIC_PLACEHOLDER;
        document.getElementById('jitter-value').textContent = '抖动 —';
        document.getElementById('download-value').textContent = METRIC_PLACEHOLDER;
        document.getElementById('upload-value').textContent = METRIC_PLACEHOLDER;
      }

      /** 测速启动：清除分级色条的上次高亮/置灰状态，避免残留陈旧等级 */
      function resetGradeScale() {
        const scale = document.getElementById('speed-scale');
        scale.classList.remove('has-result', 'muted');
        for (const item of scale.children) {
          item.classList.remove('active');
        }
      }

      /** 详情表某行写入：成功填数值（保留 1 位小数），失败/无结果填「失败」或「—」 */
      function setDetailRow(id, text) {
        document.getElementById(id).textContent = text;
      }

      /** 详情表填「—」的键（结果缺席时的展示），与页面初始 HTML 一致 */
      const DETAIL_EMPTY = '—';

      /** 测速启动：清空详情表（避免重跑的前 17 秒残留上一轮的数值） */
      function resetDetails() {
        for (const id of [
          'detail-ping',
          'detail-jitter',
          'detail-download',
          'detail-upload',
          'detail-ip',
          'detail-server',
        ]) {
          document.getElementById(id).textContent = DETAIL_EMPTY;
        }
      }

      /**
       * 填结果详情表：三个测量阶段的成功/失败结果 + 服务器信息。
       * 失败阶段对应行显示「失败」；服务器信息缺失时显示「未知位置」。
       */
      function renderDetails({ latency, download, upload, server }) {
        setDetailRow('detail-ping', latency ? `${Math.round(latency.latencyMs)} ms` : '失败');
        setDetailRow('detail-jitter', latency ? `${latency.jitterMs.toFixed(1)} ms` : '失败');
        setDetailRow(
          'detail-download',
          download ? `${download.downloadMbps.toFixed(1)} Mbps` : '失败'
        );
        setDetailRow('detail-upload', upload ? `${upload.uploadMbps.toFixed(1)} Mbps` : '失败');
        setDetailRow('detail-ip', server?.ip ?? DETAIL_EMPTY);
        // 仅有 IP 时位置无从得知 → 「未知位置」（IP 已在上一行单独展示）
        setDetailRow(
          'detail-server',
          server?.city || server?.asn
            ? [server.city, server.asn && `AS${server.asn}`].filter(Boolean).join(' · ')
            : '未知位置'
        );
      }

      /* ========== 速度分级色条 ========== */

      // 下载速度分级阈值（Mbps）：<10 差 / 10-50 一般 / 50-200 好 / >200 极好（speedtest 惯例）
      const GRADE_THRESHOLDS = [
        { name: 'great', min: 200 }, // 极好
        { name: 'good', min: 50 }, // 好
        { name: 'fair', min: 10 }, // 一般
        { name: 'poor', min: 0 }, // 差
      ];

      /** 速度 → 档位名称 */
      function gradeFor(mbps) {
        return GRADE_THRESHOLDS.find((g) => mbps >= g.min).name;
      }

      /** 按档位高亮色条对应色块（其余变暗）；加载时整体置灰 */
      function highlightGrade(gradeName) {
        const scale = document.getElementById('speed-scale');
        scale.classList.add('has-result');
        for (const item of scale.children) {
          item.classList.toggle('active', item.classList.contains(gradeName));
        }
      }

      /** 下载失败：无有效等级，整条置灰（去色 + 变暗），不残留任何档位高亮 */
      function muteGradeScale() {
        const scale = document.getElementById('speed-scale');
        scale.classList.remove('has-result');
        scale.classList.add('muted');
        for (const item of scale.children) {
          item.classList.remove('active');
        }
      }

      /* ========== 服务器信息预取 ========== */

      /**
       * 预取服务器信息：请求一次 0 字节测速端点，读取响应头的 cf-meta-* 元数据
       * （城市/国家/ASN/IP）。部分 Cloudflare 边缘不返回地理头（仅 cf-meta-ip）——
       * 拿到什么显示什么；全部缺失时返回 null，由调用方降级为「未知位置」。
       * @returns {Promise<{city: string, asn: string, ip: string}|null>}
       */
      async function fetchServerInfo() {
        try {
          // 时间戳查询参数防浏览器缓存；超时走 fetchWithTiming 的默认 15s
          const { response } = await fetchWithTiming(`${PING_URL}&_=${Date.now()}-server`);
          if (!response.ok) return null; // 非 2xx（如 429/5xx）→ 视为失败，降级「未知位置」
          const city = response.headers.get('cf-meta-city');
          const country = response.headers.get('cf-meta-country');
          const asn = response.headers.get('cf-meta-asn');
          const ip = response.headers.get('cf-meta-ip');
          if (!city && !country && !asn && !ip) return null; // 无任何元数据 → 视为失败
          return {
            city: [city, country].filter(Boolean).join(' · '),
            asn,
            ip,
          };
        } catch {
          return null; // 网络失败/超时 → 调用方显示「未知位置」
        }
      }

      /** 状态行显示服务器位置；预取失败时显示「未知位置」 */
      function showServerLocation(server) {
        if (!server) {
          document.getElementById('server-location').textContent = '连接节点：未知位置';
          return;
        }
        const parts = [];
        if (server.city) parts.push(server.city);
        if (server.asn) parts.push(`AS${server.asn}`);
        if (server.ip) parts.push(server.ip);
        document.getElementById('server-location').textContent = `连接节点：${parts.join(' · ')}`;
      }

      /* ========== 测速流程编排 ========== */

      /**
       * 完整测速流程：延迟/抖动 → 下载 → 上传。
       * 服务器信息与延迟并行预取（预取顺带充当连接预热）。
       * 单阶段失败（超时/网络错误）不中断流程：该指标显示「失败」，其余阶段照常进行。
       */
      async function runSpeedTest() {
        setBusy(true);
        resetMetrics(); // 指标卡归零
        resetGradeScale(); // 清除上次的分级高亮/置灰（避免下载失败时残留陈旧等级）
        resetDetails(); // 清空详情表（避免重跑时残留上一轮数值）
        resetRingText(); // 环内恢复默认（清除上次的失败提示）
        // 每次启动都重新预取服务器信息（显示当前连接节点），失败时状态行降级为「未知位置」
        const serverPromise = fetchServerInfo().then((server) => {
          showServerLocation(server);
          return server;
        });

        // 结果集：null = 阶段失败（流程继续，对应指标显示「失败」）
        const results = { latency: null, download: null, upload: null, server: null };

        try {
          // 阶段 1：延迟/抖动（与服务器信息预取并行；预取充当该阶段的连接预热）
          // 延迟阶段不驱动圆环——环内文案在此覆写，阶段结束后恢复默认
          document.getElementById('ring-value').textContent = '测速中…';
          document.getElementById('ring-sub').textContent = '延迟测试';
          try {
            results.latency = await measureLatency();
          } catch (err) {
            console.error('延迟测量失败：', err);
            results.latency = null;
            document.getElementById('ping-value').textContent = '失败';
            document.getElementById('jitter-value').textContent = '抖动 失败';
          }

          // 阶段 2：下载（阶段内部自行管理环文案与圆环进度）
          try {
            results.download = await measureDownload();
          } catch (err) {
            console.error('下载测量失败：', err);
            results.download = null;
            document.getElementById('download-value').textContent = '失败';
          }

          // 阶段 3：上传
          try {
            results.upload = await measureUpload();
          } catch (err) {
            console.error('上传测量失败：', err);
            results.upload = null;
            document.getElementById('upload-value').textContent = '失败';
          }

          // 等服务器信息落地（不影响测速；异常路径下其 catch 已静默处理）
          results.server = await serverPromise;

          // 汇总展示：详情表 + 速度分级色条
          renderDetails(results);
          // 速度分级以下载速度为准；下载失败时整条置灰（无有效等级，可读但不误导）
          if (results.download) {
            highlightGrade(gradeFor(results.download.downloadMbps));
          } else {
            muteGradeScale();
          }
        } finally {
          // 汇总到环：全部成功 → 提示再次测速；有阶段失败 → 环级失败可见性
          // （失败阶段的具体位置已由指标卡「失败」+ 详情表 + 色条置灰承载）
          const anyFailed = !results.latency || !results.download || !results.upload;
          if (anyFailed) {
            document.getElementById('ring-value').textContent = '部分指标失败';
            document.getElementById('ring-sub').textContent = '点击再次测速';
          } else {
            document.getElementById('ring-value').textContent = '再次测速';
            document.getElementById('ring-sub').textContent = '点击测速';
          }
          setBusy(false); // 无论成败：解除防重入锁
        }
      }

      /* ========== 圆环按钮交互（点击 / Enter / 空格） ========== */

      const ringButton = document.getElementById('ring-button');

      /** 测速运行时设置 aria-busy（按钮 + 页面），兼作重复触发防护 */
      function setBusy(busy) {
        document.body.setAttribute('aria-busy', String(busy));
        ringButton.setAttribute('aria-busy', String(busy));
      }

      /** 环内文字恢复默认（点击开始时清除上次的失败提示；阶段内部恢复用 meter.restoreRing） */
      function resetRingText() {
        document.getElementById('ring-value').textContent = '开始';
        document.getElementById('ring-sub').textContent = '点击测速';
      }

      async function handleRingTrigger() {
        if (ringButton.getAttribute('aria-busy') === 'true') return; // 防重复触发（测速中忽略点击）
        await runSpeedTest();
      }

      ringButton.addEventListener('click', handleRingTrigger);
      ringButton.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault(); // 阻止空格键滚动页面
          handleRingTrigger();
        }
      });

      // 测速引擎 API（暴露供浏览器控制台调试与手动调用）
      window.fetchWithTiming = fetchWithTiming;
      window.measureLatency = measureLatency;
      window.measureDownload = measureDownload;
      window.measureUpload = measureUpload;
    })();
  </script>
</body>
</html>
